<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ryze particle intro</title>
  <style>
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
    #intro { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    canvas { position:absolute; inset:0; display:block; width:100%; height:100%; }
    #mark { position:absolute; inset:50% auto auto 50%; width:var(--mark-size,140px); height:var(--mark-size,140px); transform:translate(-50%,-50%); opacity:0; display:block; }
    @media (prefers-reduced-motion:reduce) { canvas {display:none;} }
  </style>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <canvas id="particles"></canvas>
    <img id="mark" src="../brand-mark.svg" alt="" width="140" height="140">
  </div>
  <script type="module" src="./src/particle-intro.mjs"></script>
</body>
</html>
