    const gather = smooth((p - .1) / .62);
    const fade = 1 - smooth((p - .73) / .24);
    const solid = smooth((p - .70) / .26);
    scene.style.setProperty("--solid-alpha", solid.toFixed(4));
    context.clearRect(0, 0, width, height);
    if (p === 1 || fade <= 0) return;
    context.globalCompositeOperation = "lighter";
    for (const dot of points) {
      const t = smooth((gather - dot.delay) / (1 - dot.delay));
      const away = 1 - t;
      const curve = 4 * away * t;
      const x = width / 2 + dot.sx * away + dot.tx * t +
                dot.bend * curve + Math.sin(dot.phase + p * 17) * away * 7;
      const y = height / 2 + dot.sy * away + dot.ty * t -
                dot.bend * .46 * curve + Math.cos(dot.phase + p * 14) * away * 7;
      const alpha = enter * fade * (.28 + .67 * Math.sin(dot.phase + p * 10) ** 2);
      if (alpha < .005) continue;
      context.beginPath();
      context.fillStyle = "rgba(255,90,241," + alpha.toFixed(3) + ")";
      context.arc(x, y, dot.radius, 0, Math.PI * 2);
      context.fill();
      if (dot.trail && t > .12 && t < .96) {
        context.beginPath();
        context.lineWidth = .7;
        context.strokeStyle = "rgba(255,90,241," + (alpha * .2).toFixed(3) + ")";
        context.moveTo(x, y);
        context.lineTo(x + (dot.sx - dot.tx) * .035 * away,
                       y + (dot.sy - dot.ty) * .035 * away);
        context.stroke();
      }
    }
    context.globalCompositeOperation = "source-over";
  }

  function stop() {
    cancelAnimationFrame(raf);
    playing = false;
    scene.removeAttribute("data-playing");
    scene.style.removeProperty("--solid-alpha");
    context.clearRect(0, 0, width, height);
  }
  function frame(now) {
    if (!playing) return;
    elapsed = Math.min(now - started, duration);
    draw(elapsed);
    if (elapsed < duration) {
      raf = requestAnimationFrame(frame);
    } else {
      stop();
    }
  }
  function play() {
    if (reduced.matches) { stop(); return; }
    stop();
    setup();
    if (!points.length) return;
    scene.style.setProperty("--solid-alpha", "0");
    scene.dataset.playing = "";
    elapsed = 0;
    started = performance.now();
    playing = true;
    try { sessionStorage.setItem(seenKey, "1"); } catch {}
    raf = requestAnimationFrame(frame);
  }

  scene.setAttribute("role", "button");
  scene.setAttribute("tabindex", "0");
  scene.setAttribute("aria-label", "Знак Ryze. Повторить анимацию");
  scene.addEventListener("click", play);
  scene.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      play();
    }
  });
  reduced.addEventListener?.("change", event => { if (event.matches) stop(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });
  window.addEventListener("pagehide", stop, { once: true });
  let resizing = 0;
  window.addEventListener("resize", () => {
    cancelAnimationFrame(resizing);
    resizing = requestAnimationFrame(() => {
      if (!playing) return;
      const progress = elapsed;
      setup();
      started = performance.now() - progress;
      draw(progress);
    });
  }, { passive: true });
  let seen = false;
  try { seen = sessionStorage.getItem(seenKey) === "1"; } catch {}
  if (!seen) play();
})();
</script>
</body>
</html>
